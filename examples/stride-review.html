<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>步行支撑点与速度检查</title>
<style>body{background:#132026;color:#e4eeee;font:16px/1.7 system-ui;max-width:1080px;margin:32px auto;padding:20px}h1{font-size:26px}input{width:min(90%,700px)}img{width:100%;height:auto}svg{width:100%;background:#1c3038;border-radius:12px}small{color:#acc0c9}a{color:#a7d5be}</style>
<h1>步行支撑点与移动速度</h1><p>下图来自实际原画。标记区域由作者指定，工具不识别近远腿或自动批准步态。</p>
<label>检查速度 <input id="speed" type="range" min="0" max="400" step="1"><output id="value"></output> 场景px/秒（原画缩放已计入）</label>
<p id="metrics"></p><svg id="chart" viewBox="0 0 900 320" role="img" aria-label="各支撑组标记的相对世界横坐标"></svg>
<small>横轴为组内时间，纵轴为相对世界横坐标。平直只表示所选点稳定；脚掌滚动会改变轮廓中心，不能当作精确固定关节。折线连接测量点，不是生成的动画帧。</small>
<p id="fit"></p><img src="markers.png" alt="动作原画与人工选择的接触区域"><p><a href="report.json">测量记录</a> · <a href="input.json">标记配置</a></p>
<script>
const report=@@REPORT@@;
const slider=document.getElementById('speed'),chart=document.getElementById('chart');slider.max=Math.max(400,Math.ceil(report.speed));slider.value=report.speed;
const colors=['#ffd083','#8dd6d0','#d49ad8','#a9d799'];const groups=[...new Set(report.samples.map(s=>s.group))];
function render(){
 const speed=Number(slider.value);document.getElementById('value').textContent=speed;
 const lines=groups.map(group=>{const s=report.samples.filter(p=>p.group===group);const t0=Math.min(...s.map(p=>p.timeMs));const world=s.map(p=>p.timeMs/1000*speed*(report.direction??1)+p.point[0]*report.renderScale);const mean=world.reduce((a,b)=>a+b)/world.length;return {group,points:s.map((p,i)=>[(p.timeMs-t0)/1000,world[i]-world[0]]),sum:world.reduce((a,b)=>a+(b-mean)**2,0),range:Math.max(...world)-Math.min(...world)}});
 const extent=Math.max(10,...lines.flatMap(l=>l.points.map(p=>Math.abs(p[1])))),duration=Math.max(.1,...lines.flatMap(l=>l.points.map(p=>p[0])));const x=t=>65+t/duration*750,y=v=>160-v/extent*115;
 chart.replaceChildren();const element=(tag,attrs)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);chart.append(e);return e};
 element('line',{x1:65,y1:160,x2:820,y2:160,stroke:'#69848e'});
 for(const v of [-extent,0,extent]){const e=element('text',{x:5,y:y(v)+5,fill:'#cad9dd','font-size':14});e.textContent=v.toFixed(1)+'px'}
 for(let i=0;i<4;i++){const e=element('text',{x:x(duration*i/3),y:275,fill:'#cad9dd','font-size':14});e.textContent=(duration*i/3).toFixed(2)+'s'}
 lines.forEach((l,i)=>{const c=colors[i%colors.length];element('polyline',{points:l.points.map(p=>x(p[0])+','+y(p[1])).join(' '),stroke:c,fill:'none','stroke-width':3});for(const p of l.points)element('circle',{cx:x(p[0]),cy:y(p[1]),r:4,fill:c});const e=element('text',{x:80+i*195,y:300,fill:c,'font-size':14});e.textContent=l.group+' Δ'+l.range.toFixed(1)+'px'});
 const rms=Math.sqrt(lines.reduce((a,l)=>a+l.sum,0)/report.samples.length);document.getElementById('metrics').textContent='组内标记横向离散 RMS '+rms.toFixed(2)+' px；仅作诊断，不自动调整消费参数。';
}
document.getElementById('fit').textContent='标记最小离散拟合速度：'+report.diagnosticFitSpeed.toFixed(1)+' px/秒。标记类型：'+report.markerKind+'。'+report.note;
slider.addEventListener('input',render);render();
</script></html>
