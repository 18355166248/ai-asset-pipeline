<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色动作工作台</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#101920;color:#dce5e9}*{box-sizing:border-box}body{margin:0}header{padding:24px 32px;border-bottom:1px solid #2c3c47;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:4px 0}small,.sub{color:#95aab8}main{display:grid;grid-template-columns:290px 1fr;min-height:80vh}aside{padding:24px;border-right:1px solid #2c3c47}label{display:block;margin:16px 0 8px}select,button,input{font:inherit}button,select{background:#20323e;border:1px solid #3e5360;border-radius:8px;color:inherit;padding:10px}button{cursor:pointer}button:hover,button.active{background:#336d61;border-color:#67bca5}select{width:100%}#actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}#actions button{padding:8px 10px}.stage{padding:24px;min-width:0}#viewport{position:relative;height:510px;background:radial-gradient(ellipse at center,#2b3f49,#15222b);border-radius:16px;overflow:hidden}canvas{width:100%;height:100%;display:block}#sprite{display:none;image-rendering:pixelated}#badge{position:absolute;left:18px;top:18px;border-radius:8px;background:#101920b0;padding:10px;pointer-events:none}#toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}#timeline{width:100%;accent-color:#73cfaf}#info{line-height:1.7;font-variant-numeric:tabular-nums}#coverage{font-size:13px;line-height:1.7}#coverage ul{padding-left:18px}.warn{color:#eec78c}#status{white-space:pre-wrap}.pill{font-size:12px;color:#92d5be;border:1px solid #3f6b5b;padding:6px 10px;border-radius:16px}.help{font-size:13px;color:#95aab8;line-height:1.7}#import{display:none}#blend{width:100%}@media(max-width:800px){main{grid-template-columns:1fr}aside{border:0}#viewport{height:390px}header{padding:20px}.stage{padding:16px}}
</style>
<header><div><small>AI ASSET PIPELINE / LOCAL WORKBENCH</small><h1 id="title">角色动作工作台</h1></div><span class="pill">本地检查 · 草稿</span></header>
<main><aside><label for="character">角色 / 模型</label><select id="character"></select><div id="actions"></div><label for="speed">播放速度</label><select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select><label for="blend">模型过渡 <span id="blendValue">180ms</span></label><input id="blend" type="range" min="0" max="600" step="20" value="180"><label for="view">固定视角</label><select id="view"><option value="diagonal">斜侧</option><option value="side">侧面</option><option value="front">正面</option><option value="back">背面</option></select><p class="help">模型可拖动旋转、滚轮缩放。二维图集不补帧、不混合原画；模型切换采用姿态过渡。</p><button id="importButton">打开自己的 GLB</button><input id="import" type="file" accept=".glb"><p class="help">自包含、未压缩 GLB。模型需要自带动作；上传到服务器的行为不会发生。</p></aside>
<section class="stage"><div id="viewport"><canvas id="model"></canvas><canvas id="sprite"></canvas><span id="badge"></span></div><div id="toolbar"><button id="pause">暂停</button><button id="restart">从头播放</button><button id="step">前进一帧</button><button id="sequence">整套动作巡演</button><button id="download">生成检查记录</button><label><input id="returnIdle" type="checkbox" checked> 单次动作结束回待机</label><label><input id="loop" type="checkbox" disabled> GLB 当前动作循环</label></div><input id="timeline" aria-label="动作进度" type="range" min="0" max="1000" value="0"><p id="info"></p><div id="coverage"></div><p id="status" class="warn" role="status"></p></section></main>
<section id="review" hidden style="padding:24px 32px"><a id="saveReview" download="motion-review.json" style="color:#92d5be">保存检查记录 JSON</a><label for="reviewData">检查记录（可复制）</label><textarea id="reviewData" readonly style="width:100%;height:200px;background:#182832;color:#dce5e9"></textarea></section>
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<script type="module" src="./main.mjs"></script></html>
