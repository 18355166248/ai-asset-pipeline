<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title><style>body{margin:24px auto;padding:16px;max-width:920px;background:#14252d;color:#e7eeee;font:16px/1.6 system-ui}h1{font-size:25px}.pair{display:flex;flex-wrap:wrap;gap:16px}.panel{flex:1;min-width:260px;background:#20343d;border-radius:12px;padding:12px}canvas{width:100%;max-width:384px;display:block}button,select{padding:8px;margin:5px;background:#33525c;color:white;border:1px solid #88aaaa;border-radius:6px}a{color:#b4e2cd}small{color:#bad0d6}</style><h1>@@TITLE@@</h1><p>@@NOTE@@</p><button id="pause">暂停</button><button id="restart">从头播放</button><label>定位参考帧 <select id="inspect"></select></label><label>播放速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option></select></label><p id="phase"></p><label>播放时间 <input id="seek" type="range" min="0" step="1" value="0"></label><div class="pair"><section class="panel"><h2>@@LEFT@@</h2><canvas id="old" width="384" height="384"></canvas></section><section class="panel"><h2>@@RIGHT@@</h2><canvas id="next" width="384" height="384"></canvas></section></div><p>先看1×完整循环，再定位同一时间检查原画差异。共享播放时钟，不插帧、不淡入，也不自动认定美术通过。</p><p><a href="comparison.json">素材与时间记录</a></p><script>
const data=@@DATA@@;const seek=document.getElementById('seek');seek.max=Math.ceil(data.durationMs)-1;
let time=0,last=null,paused=false;const states=[];const label=document.getElementById('phase'),inspect=document.getElementById('inspect');
let cursor=0;for(let i=0;i<data.sources[0].frames.length;i++){const option=document.createElement('option');option.value=cursor;option.textContent='第 '+(i+1)+' 帧 · '+cursor+'ms';inspect.append(option);cursor+=data.sources[0].frames[i].durationMs}
async function load(source,id){const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('图集加载失败'));image.src=source.atlas});states.push({image,frames:source.frames,ctx:document.getElementById(id).getContext('2d')})}
Promise.all([load(data.sources[0],'old'),load(data.sources[1],'next')]).then(()=>requestAnimationFrame(tick)).catch(e=>{label.textContent='素材载入失败：'+e.message});
// 两边用同一真实毫秒时钟；各自按durationMs选帧，不假设帧数相同或均匀时长。
function tick(now){if(last!==null&&!paused)time+=(now-last)*Number(document.getElementById('speed').value);last=now;const position=time%data.durationMs;seek.value=position;const indices=[];for(const s of states){let remaining=position,index=0;while(index<s.frames.length-1&&remaining>=s.frames[index].durationMs){remaining-=s.frames[index].durationMs;index++}indices.push(index+1);const c=s.ctx,f=s.frames[index];c.clearRect(0,0,384,384);c.fillStyle='#78949d';const scale=384/Math.max(f.w,f.h),w=f.w*scale,h=f.h*scale,x=(384-w)/2,y=(384-h)/2;c.fillRect(x,y+data.anchor[1]*h,w,1);c.drawImage(s.image,f.x,f.y,f.w,f.h,x,y,w,h)}label.textContent=position.toFixed(0)+' / '+data.durationMs+' ms · 两侧帧 '+indices.join(' / ');requestAnimationFrame(tick)}
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'继续播放':'暂停'};document.getElementById('restart').onclick=()=>{time=0;last=null};seek.oninput=()=>{time=Number(seek.value);last=null;paused=true;document.getElementById('pause').textContent='继续播放'};inspect.onchange=()=>{time=Number(inspect.value);last=null;paused=true;document.getElementById('pause').textContent='继续播放'};
</script></html>
